name: Deploy Docs

# 构建 VitePress 文档站并发布到 gh-pages 分支
# （GitHub Settings → Pages → Deploy from a branch → gh-pages / (root)）
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    # pnpm 包（package.json/lockfile/scripts）整体在 docs/ 下
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout（完整历史，供 lastUpdated 读取时间）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # v6 从非根 package.json 读 packageManager 有 bug（pnpm/action-setup#227），
      # 故显式指定版本，升级 pnpm 时与 docs/package.json 的 packageManager 同步
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          # dist 是纯生成产物：单提交孤儿分支，保证删除的页面同步消失
          force_orphan: true
          commit_message: "docs: deploy ${{ github.sha }}"
