name: Deploy Docs

# 构建 VitePress 文档站并发布到 gh-pages 分支
# （GitHub Settings → Pages → Deploy from a branch → gh-pages / (root)）
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史，供 lastUpdated 读取时间）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm（读 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          # dist 是纯生成产物：单提交孤儿分支，保证删除的页面同步消失
          force_orphan: true
          commit_message: "docs: deploy ${{ github.sha }}"
